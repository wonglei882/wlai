# PM 功能分级启用配置
# Version: 1.1.0
# Created: 2026-08-17
# Updated: 2026-09-13 (新增 comic_production 漫剧制片流水线)

features:
  # ============================================================================
  # 内容类型配置（多模态领域引擎启停）
  # ============================================================================
  content_types:
    novel:
      enabled: true
      description: "长篇小说引擎（角色/伏笔/世界观/大纲/质量/段落）"
      adapter: 'novel_chapter'
      dimensions:
        - character_consistency
        - foreshadow_age
        - world_rule_drift
        - outline_drift
        - quality_score
        - paragraph_format
    comic:
      enabled: true
      description: "漫剧引擎（视觉一致性/场景连续性/分镜衔接/对话气泡）"
      adapter: 'comic_panel'
      dimensions:
        - visual_consistency
        - scene_continuity
        - panel_transition
        - dialogue_bubble
    audio:
      enabled: false
      description: "有声书引擎（桩实现，待扩展）"
      adapter: 'audio_segment'
      dimensions: []

  # ============================================================================
  # 核心功能（默认启用，不可关闭）
  # ============================================================================
  core:
    inspection:
      enabled: true
      description: "PM 巡检核心功能"
      interval_minutes: 4320  # 3 天一次（3*24*60=4320 分钟）
      dimensions:
        - character_consistency
        - foreshadow_age
        - world_rule_drift
      # outline_drift 已移除：无实际修复路径，扫描仅写诊断日志属空转
      # _fix_outline_drift handler 仍保留供手动 API 调用

    repair:
      enabled: true
      description: "PM 修复闭环"
      auto_fix: true
      verify: true

    feedback:
      enabled: true
      description: "用户反馈闭环"
      user_approval: true

    autonomy_unify:
      enabled: true
      description: "自主等级阈值统一：PMAutonomyConfig.level 调制决策阈值；关闭则忽略 DB 配置（行为=advisor_plus 硬编码兼容）"

  # ============================================================================
  # 辅助功能（按需启用，需用户配置）
  # ============================================================================
  optional:
    auto_tuning:
      enabled: false
      description: "自调参（失败时自动调整参数）"
      trigger: "failure_threshold"
      threshold: 3
      cooldown_hours: 24
      token_cost: "high"

    causal_graph:
      enabled: false
      description: "因果图推理（章节创建时自动推理因果链）"
      trigger: "chapter_created"
      min_content_length: 200
      token_cost: "high"

    quality_forecast:
      enabled: false
      description: "质量预报（生成前预测质量）"
      trigger: "before_generation"
      token_cost: "high"

    ooc_detection:
      enabled: false
      description: "OOC 检测（角色行为偏离检测）"
      trigger: "on_demand"
      token_cost: "medium"

    long_novel_guardian:
      enabled: false
      description: "长篇守护（长篇小说一致性守护）"
      trigger: "on_demand"
      token_cost: "medium"

    self_evolution:
      enabled: true
      description: "自进化（技能自生长）"
      trigger: "on_demand"
      token_cost: "very_high"
      similarity_threshold: 0.8    # 经验相似度 > 此值合并
      decay_half_life_days: 30     # 经验置信度衰减半衰期（天）

    world_drift_llm_fix:
      enabled: true
      description: "世界观漂移 LLM 根因修复（更新 world_rules 正文，非仅 hash 对齐）"
      trigger: "on_world_drift"
      token_cost: "medium"
    proactive_reporter:
      enabled: true
      description: "主动汇报器（巡检发现问题后生成预警报告，写入前端诊断面板）"
      dedup_hours: 1          # 同项目同类型未解决预警去重窗口
      persist_suggestions: true  # 是否将主动建议也写入诊断面板

    companion:
      enabled: false
      description: "智能创作陪伴（苏格拉底引导 + 家教分层反馈 + 百科知识 + 秘书贴心简报）"
      trigger: "on_demand"
      token_cost: "low"
      socratic_levels: 3          # 引导提问层数（现象→原因→方案）
      tutor_tiers: ["principle", "hint", "example"]  # 家教分层反馈递进

    learning:
      enabled: false
      description: "经验进化（L4）：修复模式沉淀复用 + 用户画像学习 + 引导采纳反馈"
      trigger: "continuous"
      token_cost: "low"
      pattern_store_limit: 50    # 模式库单类型保留上限
      profile_recompute_every: 20  # 每 N 次决策重算经验水平


  # ============================================================================
  # 批处理功能（离线执行，降低在线负载）
  # ============================================================================
  batch:
    high_freq_words:
      enabled: true
      description: "高频词扫描（每日凌晨批处理）"
      schedule: "daily"
      time: "02:00"
      token_cost: "low"

    continuity_audit:
      enabled: true
      description: "连续性审计（每日凌晨批处理）"
      schedule: "daily"
      time: "03:00"
      token_cost: "low"

# ============================================================================
# 成本控制
# ============================================================================
cost_control:
  max_tokens_per_day: 100000
  alert_threshold: 0.8
  auto_disable_threshold: 1.0

# ============================================================================
# 性能优化
# ============================================================================
performance:
  scan_timeout_seconds: 300
  max_issues_per_round: 100
  parallel_projects: true
  decompose_threshold: 3       # 问题数超过此值时调用 LLM 排序（避免硬编码）
  cleanup_every_rounds: 48    # 每 N 轮巡检清理一次历史日志（48 轮 ≈ 24h）
  max_auto_fix_attempts: 3    # 近 7 天同类修复尝试上限（止血#3：超过转人工，防无限重试）
  idle_threshold_rounds: 2    # 连续空闲 N 轮后降频
  idle_interval_multiplier: 4 # 降频倍数（2 轮空闲 → 间隔 × 4）
  max_crash_restart: 3        # 巡检循环异常最大自动重启次数（崩溃保护上限）

# ============================================================================
# 扫描维度参数声明
# 将硬编码阈值集中管理，支持运行时调参（self_tuning 可动态覆盖）
# ============================================================================
scanner_params:
  character_consistency:
    z_score_threshold: { default: 2.0, min: 1.0, max: 5.0, description: "Z-score 异常检测阈值" }
    min_samples: { default: 5, min: 3, max: 20, description: "最小样本量（低于此值退回硬阈值）" }
  foreshadow_age:
    low_age_threshold: { default: 10, min: 5, max: 50, description: "伏笔老化章节阈值" }
    decay_lambda_default: { default: 0.10, min: 0.01, max: 0.5, description: "默认衰减速率" }
    urgency_threshold: { default: 0.3, min: 0.1, max: 0.9, description: "紧急度预警阈值" }
  quality_score:
    score_threshold: { default: 70, min: 50, max: 90, description: "质量评分低于此值生成 issue" }
  paragraph_format:
    max_chars: { default: 110, min: 50, max: 300, description: "段落最大字数" }
    long_para_threshold: { default: 3, min: 1, max: 10, description: "超长段落数超过此值报 issue" }

# ============================================================================
# 世界观冲突检测配置
# 用于 _verify_world_keywords：检测章节正文是否引入与世界观规则冲突的设定
# key 为规则关键词（出现在 world_rules 中），value 为冲突标记词列表
# 项目可按需在 world_rules 中引用这些规则名以启用检测
# ============================================================================
worldview_conflict_markers:
  无魔法:
    - 魔法
    - 咒语
    - 法术
    - 魔杖
    - 魔力
  现实世界:
    - 穿越
    - 重生
    - 系统
    - 异世界
    - 修仙
  修仙世界:
    - 科技
    - 枪械
    - 电脑
    - 手机
  现代都市:
    - 轻功
    - 内力
    - 真气
    - 丹田

# ============================================================================
# 漫剧制片流水线配置（AI 漫剧制片 Agent）
# ============================================================================
comic_production:
  enabled: true
  description: "漫剧制片流水线（设定圣经/分镜/提示词编译/素材管理/审核）"
  shot_state_machine:
    states:
      - pending_script
      - pending_image
      - pending_review_image
      - pending_video
      - pending_voice
      - pending_composite
      - completed
    auto_advance: false  # 是否自动推进状态（MVP 默认手动）
  guardian:
    enabled: true           # 一致性守护总开关（事前+事中）
    block_on_critical: true # 事中门控是否硬阻塞（critical 问题拒绝状态转换）
    visual_threshold: 0.7   # 视觉一致性评分阈值（低于此值阻塞出图审核）
  prompt_compiler:
    default_platform: 'midjourney'  # 默认出图平台
    supported_platforms:
      - midjourney
      - stable_diffusion
      - jimeng
      - kling
  storyboard_generator:
    default_shot_duration: 4.0  # 默认镜头时长（秒）
    max_dialogue_chars: 15      # 台词最大字数
  review_checkpoints:
    required_types:
      - character_design     # 角色定稿
      - storyboard_confirm   # 分镜确认
      - first_frame          # 首帧确认
      - video_confirm        # 视频确认
      - final_cut            # 成片确认
