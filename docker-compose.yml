# WLai PM — Docker Compose（后端 + 前端 + PostgreSQL + Redis）
#
# 启动: docker compose up -d
# 前端: http://localhost:3000
# 后端: http://localhost:8000
# 日志: docker compose logs -f
# 停止: docker compose down

name: wlai

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wlai}
      POSTGRES_USER: ${POSTGRES_USER:-wlai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wlai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Docker 模式下自动注入数据库和 Redis 连接
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-wlai}:${POSTGRES_PASSWORD:-change_me_in_production}@db:5432/${POSTGRES_DB:-wlai}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 是构建期内联变量，须放在 build.args（浏览器访问的地址）
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
